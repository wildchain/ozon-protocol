[workspace]
members = ["ozon-cli", "avs/ozon-oracle-sdk", "programs/avs-oracle"]
resolver = "2"

# [workspace.dependencies]
# anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# anchor-spl = { version = "0.31.1" }
[workspace.dependencies]
solana-program = "=2.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1


[patch.crates-io]
borsh = { version = "0.10.4", package = "borsh" }
borsh-derive = { version = "0.10.4", package = "borsh-derive" }
