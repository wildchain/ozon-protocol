[package]
name = "ozon-oracle-sdk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "avs-oracle"
path = "src/main.rs"

[dependencies]
anchor-client = "0.31.1"
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
serde_json = "1.0"
avs-oracle = { path = "../../programs/avs-oracle" }
restaking-programs = "0.1.3"
hex = "0.4"
sha2 = "0.10"
