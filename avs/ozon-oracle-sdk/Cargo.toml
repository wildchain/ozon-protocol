[package]
name = "ozon-oracle-sdk"
version = "0.1.7"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wildchain/ozon_contract"
homepage = "https://github.com/wildchain/ozon_contract"
readme = "README.md"
keywords = ["solana", "avs", "ozon-oracle-avs", "ozon-sdk", "programs"]
categories = ["command-line-utilities"]
authors = ["Bristin Borah  <bristinozon@gmail.com>"]
description = "Ozon oracle sdk to interact with the Ozon AVS oracle program on Solana."

[[bin]]
name = "avs-oracle"
path = "src/main.rs"

[dependencies]
avs-oracle = "0.1.6"
anchor-client = "0.31.1"
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
serde_json = "1.0"
restaking-programs = "0.1.3"
hex = "0.4"
sha2 = "0.10"
solana-sdk = "2.0"
