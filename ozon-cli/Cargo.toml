[package]
name = "ozon-cli"
version = "0.1.0"
edition = "2021"
description = "Ozon CLI for interacting with restaking program"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anchor-client = "0.31.1"
restaking-programs = { path = "../programs/restaking-programs" }
dirs = "5"

[package.metadata.binstall]
bin-dir = "ozon-cli"

[[bin]]
name = "ozon-cli"
path = "src/main.rs"
