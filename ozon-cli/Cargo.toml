[package]
name = "ozon-cli"
version = "0.1.2"
edition = "2021"
authors = ["Bristin Borah  <bristinozon@gmail.com>"]
description = "Ozon CLI for interacting with restaking program that helps user to manage and register operators and AVSs with the Ozon protocol."
license = "Apache-2.0"
repository = "https://github.com/wildchain/ozon_contract"
homepage = "https://github.com/wildchain/ozon_contract"
readme = "README.md"
keywords = ["solana", "ozon", "cli", "restaking", "programs"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anchor-client = "0.31.1"
restaking-programs = "0.1.1"
dirs = "5"


[[bin]]
name = "ozon-cli"
path = "src/main.rs"
